    <script>
      // Fix for environments/iframes where window.fetch is getter-only on Window.prototype
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _fetch = originalFetch;
          if (typeof window !== 'undefined') {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _fetch;
              },
              set: function(val) {
                _fetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Ignore error if property cannot be redefined
        }
      })();
    </script>
