  <text x="50" y="164" fill="#59636e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">256,059 bytes</text>
  <text x="50" y="190" fill="#1f2328" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">92.35%</text>
  <circle cx="291" cy="137" r="5" fill="#6f42c1"/>
  <text x="304" y="141" fill="#1f2328" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">CSS</text>
  <text x="304" y="164" fill="#59636e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">19,582 bytes</text>
  <text x="304" y="190" fill="#1f2328" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">7.06%</text>
  <circle cx="535" cy="137" r="5" fill="#e34c26"/>
  <text x="548" y="141" fill="#1f2328" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">HTML</text>
